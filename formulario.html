<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.embaixadacarioca.com/formulario" />
    <meta
      http-equiv="refresh"
      content="0; url=https://www.embaixadacarioca.com/formulario"
    />
    <title>Redirecionando | Embaixada Carioca</title>
    <script>
      (() => {
        const destination = new URL(
          "https://www.embaixadacarioca.com/formulario"
        );
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.location.replace(destination.href);
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecionando para o
      <a href="https://www.embaixadacarioca.com/formulario">
        formulário da Embaixada Carioca
      </a>.
    </p>
  </body>
</html>
