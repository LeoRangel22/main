name: Journey completion workspace
on:
  push:
    branches: [fix/journey-integrity-20261014]
    paths: ['.github/workflows/journey-completion-workspace.yml','scripts/journey-completion-edit.py','checks/journey-completion.sql','checks/journey-completion.test.cjs','tests/journey-completion.spec.js']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/journey-integrity-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed bounded source changes
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = '568959d642b3f8d2d352b43f7346bbecf356861f'
          python3 scripts/journey-completion-edit.py
          node --check app.js
          node --check commercial-rules.js
          git diff --stat
      - run: npm ci
      - name: Verify database permissions, public evidence and isolated restore
        env:
          TEST_DATABASE_URL: postgres://postgres:event-test-only@127.0.0.1:5432/postgres
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          npm run test:db 2>&1 | tee /tmp/journey-completion-db.log
          bash scripts/restore-test.sh 2>&1 | tee /tmp/journey-completion-restore.log
      - run: npx playwright install --with-deps chromium
      - name: Verify complete code and browser suites
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/journey-completion-suite.log
      - name: Commit tested feature changes and remove temporary workspace
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/journey-integrity-20261014'
          git add app.js commercial-rules.js index.html clientes.html comunicacao.html valores.html scripts/test-database.cjs supabase/migrations/20261014084722_journey_integrity.sql
          git diff --cached --name-only | while read -r f; do
            case "$f" in app.js|commercial-rules.js|index.html|clientes.html|comunicacao.html|valores.html|scripts/test-database.cjs|supabase/migrations/20261014084722_journey_integrity.sql) ;; *) echo "Unexpected path: $f"; exit 1;; esac
          done
          git rm scripts/journey-completion-edit.py .github/workflows/journey-completion-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve public evidence and complete reviewed journey transitions'
          git push origin HEAD:refs/heads/fix/journey-integrity-20261014
      - name: Export tested source and results
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=playwright-report --exclude=test-results -czf /tmp/journey-completion-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journey-completion-verification
          path: |
            /tmp/journey-completion-source.tar.gz
            /tmp/journey-completion-db.log
            /tmp/journey-completion-restore.log
            /tmp/journey-completion-suite.log
            playwright-report/
            test-results/
          retention-days: 2
