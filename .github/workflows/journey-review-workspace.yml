name: Journey final review verification
on:
  push:
    branches: [fix/journey-integrity-20261014]
    paths: ['.github/workflows/journey-review-workspace.yml','scripts/journey-review-refine.py']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/journey-integrity-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-test-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded final review refinements
        run: |
          set -euo pipefail
          test "$(git hash-object app.js)" = 'f75c02d8b94f503adc4e6716ae0d34143519d6e9'
          python3 scripts/journey-review-refine.py
          node --check app.js
      - run: npm ci
      - name: Verify complete database journeys and isolated restore
        env:
          TEST_DATABASE_URL: postgres://postgres:event-test-only@127.0.0.1:5432/postgres
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          npm run test:db 2>&1 | tee /tmp/review-db.log
          bash scripts/restore-test.sh 2>&1 | tee /tmp/review-restore.log
      - run: npx playwright install --with-deps chromium
      - name: Verify complete code and browser suites
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/review-suite.log
      - name: Commit tested refinement only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/journey-integrity-20261014'
          git add app.js checks/journey-integrity.sql tests/journey-integrity.spec.js supabase/migrations/20261014084722_journey_integrity.sql
          git diff --cached --name-only | while read -r f; do
            case "$f" in app.js|checks/journey-integrity.sql|tests/journey-integrity.spec.js|supabase/migrations/20261014084722_journey_integrity.sql) ;; *) echo "Unexpected path: $f";exit 1;;esac
          done
          git rm scripts/journey-review-refine.py .github/workflows/journey-review-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain booked agreement identity and public revision history'
          git push origin HEAD:refs/heads/fix/journey-integrity-20261014
      - name: Retain source and results
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=playwright-report --exclude=test-results -czf /tmp/review-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: journey-final-review
          path: |
            /tmp/review-source.tar.gz
            /tmp/review-db.log
            /tmp/review-restore.log
            /tmp/review-suite.log
            playwright-report/
            test-results/
          retention-days: 2
