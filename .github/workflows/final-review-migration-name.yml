name: Generate final review migration filename
on:
  push:
    branches: [fix/events-final-review-20261018]
    paths: ['.github/workflows/final-review-migration-name.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/events-final-review-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate empty migration locally; no project access
        run: |
          npx --yes supabase@2.39.2 migration new --help
          npx --yes supabase@2.39.2 migration new final_review_edges
          find supabase/migrations -name '*_final_review_edges.sql' > /tmp/migration-name.txt
          git archive --format=tar.gz -o /tmp/review-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-review-migration-name
          path: |
            /tmp/migration-name.txt
            /tmp/review-source.tar.gz
          retention-days: 1
