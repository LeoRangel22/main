name: Approval closure workspace
on:
  push:
    branches: [fix/approval-closure-20261013]
permissions:
  contents: read
concurrency:
  group: approval-closure-feature-verification
  cancel-in-progress: true
jobs:
  workspace:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/approval-closure-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-test-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply explicit scoped edits
        if: hashFiles('scripts/approval-closure-edit.py') != ''
        run: |
          set -euo pipefail
          python3 scripts/approval-closure-edit.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/migrations/20261013183019_approval_closure.sql')
          s=p.read_text()
          a=s.index('    elsif exists(select 1 from public.event_approval_notifications n')
          b=s.index('    elsif a.created_at',a)
          s=s[:a]+re.sub(r'\bn\b','notice_row',s[a:b])+s[b:]
          p.write_text(s)
          PY
          git add app.js aprovacoes.html aprovacoes.js checks/remote-approval.test.cjs clientes.html comunicacao.html docs/REMOTE-APPROVAL.md formulario.html index.html proposta.html scripts/test-database.cjs supabase/functions/event-proposal-approval/index.ts tests/remote-approval-production.spec.js tests/remote-approval.spec.js valores.html supabase/migrations/20261013183019_approval_closure.sql
          git diff --cached --name-only | while read -r file; do
            case "$file" in app.js|index.html|clientes.html|comunicacao.html|valores.html|proposta.html|formulario.html|aprovacoes.html|aprovacoes.js|checks/remote-approval.test.cjs|tests/remote-approval-production.spec.js|tests/remote-approval.spec.js|supabase/functions/event-proposal-approval/index.ts|scripts/test-database.cjs|docs/REMOTE-APPROVAL.md|supabase/migrations/20261013183019_approval_closure.sql) ;; *) echo "Unexpected path: $file"; exit 1;; esac
          done
          git diff --cached --stat
      - run: npm ci
      - name: Database fresh upgrade concurrency and isolated restore
        env:
          TEST_DATABASE_URL: postgres://postgres:event-test-only@127.0.0.1:5432/postgres
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          npm run test:db 2>&1 | tee /tmp/closure-db.log
          bash scripts/restore-test.sh
      - name: Application and full browser regressions
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Commit only verified feature source and remove auxiliary transport
        if: hashFiles('scripts/approval-closure-edit.py') != ''
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/approval-closure-20261013'
          git rm scripts/approval-closure-edit.py scripts/approval-closure.part1 .github/workflows/approval-closure-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close approval review gaps and add stalled-request monitoring'
          git push origin HEAD:refs/heads/fix/approval-closure-20261013
      - name: Export exact checked source
        if: always()
        run: tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=test-results --exclude=playwright-report -czf /tmp/approval-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-closure-workspace
          path: |
            /tmp/approval-source.tar.gz
            /tmp/closure-db.log
            playwright-report/
            test-results/
          retention-days: 2
