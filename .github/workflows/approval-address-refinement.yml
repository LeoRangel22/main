name: Approval address refinement
on:
  push:
    branches: [fix/approval-front-hotfix-20261013]
    paths: ['.github/workflows/approval-address-refinement.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/approval-front-hotfix-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Guard and test invalid email in the existing quick-reply function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js');s=p.read_text();a=s.index('async function runQuickReply(');b=s.index('function renderQuickReplies(',a)
          part=s[a:b]
          old='''    const email = context.email;
              if (!email) {
                showToast("Preencha o e-mail do cliente para abrir a mensagem.");'''
          new='''    const email = String(context.email || "").trim();
              if (!isLikelyEmailAddress(email)) {
                showToast("Preencha um e-mail válido do cliente antes de abrir a mensagem.");'''
          assert part.count(old)==1
          p.write_text(s[:a]+part.replace(old,new)+s[b:])
          p=Path('checks/approval-email-routing.test.cjs');s=p.read_text()
          s=s.replace('function setup(enabled,confirmed=true){',"function setup(enabled,confirmed=true,email='fixture@example.test'){")
          s=s.replace("getQuickReplyContext:()=>({email:'fixture@example.test',status:'negociacao'}),","getQuickReplyContext:()=>({email,status:'negociacao'}),")
          marker="    remoteProposalApprovalEnabled:async()=>enabled,"
          assert s.count(marker)==1
          s=s.replace(marker,"    isLikelyEmailAddress:value=>/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(value),\n"+marker)
          s+='''\nfor(const email of ['foo','bad@','x@y',''])test(`invalid contingency email is rejected: ${email||'empty'}`,async()=>{
            const f=setup(false,true,email);await f.run();assert.equal(f.calls.sent.length,0);assert.equal(f.calls.reviews.length,0);assert.equal(f.location.href,'');assert.equal(f.calls.logs.length,0);
          });
          test('contingency trims a valid destination before reviewing and opening',async()=>{
            const f=setup(false,true,'  fixture@example.test  ');await f.run();assert.equal(f.calls.reviews[0].destination,'fixture@example.test');assert.equal(new URL(f.location.href).pathname,'fixture%40example.test');
          });
          '''
          p.write_text(s)
          PY
          git add app.js checks/approval-email-routing.test.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Commit only verified address validation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/approval-front-hotfix-20261013'
          git rm .github/workflows/approval-address-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate quick-reply email before contingency review'
          git push origin HEAD:refs/heads/fix/approval-front-hotfix-20261013
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-address-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 2
