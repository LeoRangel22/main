name: Proposal repair workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/proposal-repair-workspace.yml'
      - 'scripts/proposal-repair.patch'
      - 'scripts/proposal-repair-followup.py'
permissions:
  contents: read
concurrency:
  group: proposal-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/proposal-persistence-review-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Decode and inspect versioned repair transport
        if: hashFiles('scripts/proposal-repair.patch') != ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,base64,gzip,hashlib
          s=pathlib.Path('scripts/proposal-repair.patch').read_text().strip()
          for i,j,v in reversed([[162,162,'93gt'],[641,641,'BtP'],[3724,3725,''],[4228,4228,'+']]):
              s=s[:i]+v+s[j:]
          data=gzip.decompress(base64.b64decode(s))
          assert hashlib.sha256(data).hexdigest()=='ac8970b5a46955c60f4747cb40f8ca602e3c49191cc1547e289c246e05473b6b'
          pathlib.Path('/tmp/proposal-repair.diff').write_bytes(data)
          PY
          git apply --check /tmp/proposal-repair.diff
          git apply --index /tmp/proposal-repair.diff
          python3 scripts/proposal-repair-followup.py
          git add app.js
          if git diff --cached --name-only | grep -E '(^\.github/|(^|/)\.env|package(-lock)?\.json$)'; then
            echo 'Patch attempts to change a protected workspace path'; exit 1
          fi
          git diff --cached --stat
      - name: Verify application and browser regressions
        if: hashFiles('scripts/proposal-repair.patch') != ''
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Verify fresh, upgrade, permissions and concurrency
        if: hashFiles('scripts/proposal-repair.patch') != ''
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:event-test-only@127.0.0.1:5432/postgres
      - name: Commit verified repair to feature branch only
        if: hashFiles('scripts/proposal-repair.patch') != ''
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'fix/proposal-persistence-review-20261012'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve proposal writes and bind email delivery to exact reviewed content'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: proposal-repair-diagnostics
          path: |
            playwright-report/
            test-results/
            scripts/proposal-repair.patch
          retention-days: 1
