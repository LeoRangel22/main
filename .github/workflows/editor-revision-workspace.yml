name: Editor revision repair workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/editor-revision-workspace.yml'
      - 'scripts/editor-revision.patch'
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/post-send-editor-revision-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: git archive --format=tar.gz -o /tmp/event-source-current.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: editor-revision-source
          path: /tmp/event-source-current.tar.gz
          retention-days: 1
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/post-send-editor-revision-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed repair on feature branch only
        if: hashFiles('scripts/editor-revision.patch') != ''
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_BRANCH" = 'fix/post-send-editor-revision-20261012'
          git apply --check scripts/editor-revision.patch
          git apply --index scripts/editor-revision.patch
          if git diff --cached --name-only | grep -E '(^\.github/|(^|/)\.env|package(-lock)?\.json$)'; then
            echo 'Patch attempts to change a protected workspace path'; exit 1
          fi
          npm ci
          npm run build
          node --test checks/*.test.cjs
          git rm scripts/editor-revision.patch .github/workflows/editor-revision-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile post-send editor revisions without losing local edits'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
