name: Approval frontend verification
on:
  push:
    branches: [fix/approval-front-hotfix-20261013]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/approval-front-hotfix-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply the two backend-independent fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js');s=p.read_text()
          before='''  const emailMessage = renderCommunicationTemplateText(emailTemplate.emailBody, getQuickReplyContext(), proposalUrl);
            const emailSubject = emailTemplate.subject || "Sua proposta de evento na Embaixada Carioca";'''
          after='''  // Preserve the chosen quick reply when remote approval is disabled.
            const emailMessage = typeof message === "string" ? message
              : renderCommunicationTemplateText(emailTemplate.emailBody, getQuickReplyContext(), proposalUrl);
            const emailSubject = typeof subject === "string" && subject.trim() ? subject
              : emailTemplate.subject || "Sua proposta de evento na Embaixada Carioca";'''
          assert s.count(before)==1
          p.write_text(s.replace(before,after))
          for name in ['index.html','clientes.html','comunicacao.html','valores.html','formulario.html','proposta.html','aprovacoes.html']:
              p=Path(name);s=p.read_text()
              s,n=re.subn(r'((?:src|href)="\./(?:app\.js|remote-approval-ui\.js|aprovacoes\.js|approval\.css|formulario\.js|proposta\.js))(?:\?[^\"]*)?(\")',r'\1?v=20261013-approval-hotfix\2',s)
              assert n>0
              p.write_text(s)
          PY
          cat > checks/approval-cache.test.cjs <<'JS'
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          for(const page of ['index.html','clientes.html','comunicacao.html','valores.html'])test(`approval cache rollout: ${page}`,()=>{
            const html=fs.readFileSync(`${__dirname}/../${page}`,'utf8');
            const app=html.match(/src="\.\/app\.js\?v=([^"]+)"/);
            const helper=html.match(/src="\.\/remote-approval-ui\.js\?v=([^"]+)"/);
            assert.ok(app&&helper);assert.equal(app[1],helper[1]);assert.ok(app[1].slice(0,8)>='20261013');assert.doesNotMatch(html,/app\.js\?v=20261012-integrity/);
          });
          for(const [page,asset] of [['aprovacoes.html','aprovacoes.js'],['formulario.html','formulario.js'],['proposta.html','proposta.js']])test(`approval public cache rollout: ${page}`,()=>{
            const html=fs.readFileSync(`${__dirname}/../${page}`,'utf8');
            assert.ok(html.includes(asset+'?v=20261013-approval-'));
          });
          JS
          cat >> tests/remote-approval-production.spec.js <<'JS'

          test('production disabled approval preserves selected quick-reply subject and text in preview and dispatch',async({page})=>{
            await mount(page);
            const result=await page.evaluate(async()=>{
              const proposal=getActiveProposal();let capturedReview;
              state.supabase.rpc=async()=>({data:{enabled:false}});
              confirmClientSend=async review=>{capturedReview=review;return true;};
              state.supabase.functions.invoke=async(name,{body})=>{
                window.approvalProductionCalls.push({name,body});
                if(body.preview)return {data:{ok:true,mode:'preview',html:'<p>Selected follow-up</p>',text:body.message,subject:body.title,sender:'Fixture',contentHash:'reviewed',reviewedRevision:body.reviewedRevision}};
                return {data:{ok:true,message:'Accepted fixture'}};
              };
              loadCommercialInsights=async()=>{};loadEventOperations=async()=>{};loadProposalHistory=async()=>{};
              reconcileProposalEditorAfterSend=async()=> 'reconciled';
              const ok=await sendProposalEmailViaZepto({proposal,proposalUrl:getPublicProposalUrl(proposal),email:'fixture@example.test',message:'Retorno escolhido sobre o pagamento',subject:'Assunto específico de acompanhamento',title:'Acompanhamento'});
              return {ok,calls:window.approvalProductionCalls,review:capturedReview};
            });
            expect(result.ok).toBe(true);expect(result.calls).toHaveLength(2);
            for(const call of result.calls){expect(call.body.message).toBe('Retorno escolhido sobre o pagamento');expect(call.body.title).toBe('Assunto específico de acompanhamento');}
            expect(result.review.message).toBe('Retorno escolhido sobre o pagamento');expect(result.review.subject).toBe('Assunto específico de acompanhamento');
          });
          JS
          git add app.js index.html clientes.html comunicacao.html valores.html formulario.html proposta.html aprovacoes.html checks/approval-cache.test.cjs tests/remote-approval-production.spec.js
          git diff --cached --name-only | while read -r file; do
            case "$file" in app.js|index.html|clientes.html|comunicacao.html|valores.html|formulario.html|proposta.html|aprovacoes.html|checks/approval-cache.test.cjs|tests/remote-approval-production.spec.js) ;; *) exit 1;; esac
          done
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Commit verified frontend changes only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/approval-front-hotfix-20261013'
          git rm .github/workflows/approval-front-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: refresh approval assets and preserve chosen email replies'
          git push origin HEAD:refs/heads/fix/approval-front-hotfix-20261013
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 2
