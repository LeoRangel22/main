name: Generate cohort amendment correction filename
on:
  push:
    branches: [fix/events-final-review-20261018]
    paths: ['.github/workflows/cohort-backfill-name.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'LeoRangel22/main' && github.ref == 'refs/heads/fix/events-final-review-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Generate local migration; no project credentials
        run: |
          npx --yes supabase@2.39.2 migration new --help
          npx --yes supabase@2.39.2 migration new cohort_amendment_evidence
          find supabase/migrations -name '*_cohort_amendment_evidence.sql'
