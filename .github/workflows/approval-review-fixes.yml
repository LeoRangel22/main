name: Approval review fixes
on:
  push:
    branches: ['feat/remote-proposal-approval-20261013']
    paths: ['scripts/approval-review-fixes.patch','.github/workflows/approval-review-fixes.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.ref == 'refs/heads/feat/remote-proposal-approval-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: event-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Apply review fixes and run all regressions
        env:
          TEST_DATABASE_URL: postgres://postgres:event-test-only@127.0.0.1:5432/postgres
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/remote-proposal-approval-20261013'
          git apply --check scripts/approval-review-fixes.patch
          git apply --index scripts/approval-review-fixes.patch
          if git diff --cached --name-only | grep -E '(^\.github/|(^|/)\.env|package(-lock)?\.json$)'; then exit 1; fi
          npx --yes supabase@2.39.2 migration new --help
          npx --yes supabase@2.39.2 migration new remote_approval_review_fixes
          migration=$(find supabase/migrations -name '*_remote_approval_review_fixes.sql')
          test -n "$migration"
          cat scripts/approval-review-migration.sql > "$migration"
          git add "$migration"
          git rm -f scripts/approval-review-migration.sql
          npm ci
          npm run build
          node --test checks/*.test.cjs
          npm run test:db
          bash scripts/restore-test.sh
          npx playwright install --with-deps chromium
          npx playwright test --workers=2
          git rm scripts/approval-review-fixes.patch .github/workflows/approval-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close approval rollout, retry, duplicate request and post-send sharing gaps'
          git push origin HEAD:refs/heads/feat/remote-proposal-approval-20261013
      - name: Export exact source and migration
        if: always()
        run: |
          git archive --format=tar.gz -o /tmp/approval-review-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/approval-review-head.txt
          git diff > /tmp/approval-review-working.diff
          git diff --cached > /tmp/approval-review-staged.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approval-review-results
          path: |
            /tmp/approval-review-source.tar.gz
            /tmp/approval-review-head.txt
            /tmp/approval-review-working.diff
            /tmp/approval-review-staged.diff
            test-results/
          retention-days: 2
